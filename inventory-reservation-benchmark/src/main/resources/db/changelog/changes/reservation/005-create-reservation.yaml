databaseChangeLog:
  - changeSet:
      id: 005-create-reservation
      author: inventory-reservation-benchmark
      changes:
        - createTable:
            tableName: reservation
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_reservation
                    nullable: false
              - column:
                  name: customer_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: expires_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: reservation
            baseColumnNames: customer_id
            constraintName: fk_reservation_customer
            referencedTableName: customer
            referencedColumnNames: id
        - addForeignKeyConstraint:
            baseTableName: reservation
            baseColumnNames: product_id
            constraintName: fk_reservation_product
            referencedTableName: product
            referencedColumnNames: id
        - sql:
            dbms: postgresql
            sql: ALTER TABLE reservation ADD CONSTRAINT ck_reservation_quantity_positive CHECK (quantity > 0)
