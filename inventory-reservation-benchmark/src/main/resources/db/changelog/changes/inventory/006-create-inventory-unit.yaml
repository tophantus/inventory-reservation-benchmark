databaseChangeLog:
  - changeSet:
      id: 006-create-inventory-unit
      author: inventory-reservation-benchmark
      changes:
        - createTable:
            tableName: inventory_unit
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_inventory_unit
                    nullable: false
              - column:
                  name: inventory_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: inventory_unit
            baseColumnNames: inventory_id
            constraintName: fk_inventory_unit_inventory
            referencedTableName: inventory
            referencedColumnNames: id
        - createIndex:
            tableName: inventory_unit
            indexName: idx_inventory_unit_inventory_id
            columns:
              - column:
                  name: inventory_id
